<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171711">
  <title>Leitura de obras · Cartomante RAG</title>
  <link rel="stylesheet" href="/assets/styles.css?v=home-chat-large-9">
</head>
<body class="reading-page">
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header shell">
    <a class="brand" href="/" aria-label="Cartomante RAG — início">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Cartomante <em>RAG</em></span>
    </a>
    <a class="reading-back-link" href="/">
      <span aria-hidden="true">←</span>
      <span>voltar à mesa</span>
    </a>
  </header>

  <main class="reading-page-main shell">
    <section class="free-reading" aria-labelledby="free-reading-title">
      <div class="reading-intro reading-page-intro">
        <div>
          <p class="eyebrow">leitura de mão gratuita · três cartas</p>
          <h1 id="free-reading-title">Uma obra espera por você.</h1>
        </div>
        <p>
          Três cartas serão dispostas sobre a mesa. Vire apenas uma — as outras
          permanecem em segredo até a próxima leitura.
        </p>
      </div>

      <div class="reading-table">
        <div class="reading-table-ornament" aria-hidden="true">✦ &nbsp; ☾ &nbsp; ✧ &nbsp; ☉ &nbsp; ✦</div>
        <div class="reading-deck" id="reading-deck" aria-live="polite"></div>
        <div class="reading-footer">
          <span class="reading-status" id="reading-status">Embaralhando o acervo…</span>
          <button class="reading-again" id="new-reading" type="button" hidden>
            Nova leitura <span aria-hidden="true">↻</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer shell">
    <span>Cartomante RAG</span>
    <span>uma obra por leitura</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/reading.js?v=free-reading-7" defer></script>
</body>
</html>
