services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: acartomante-redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${REDIS_VOLUME}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  qdrant:
    image: qdrant/qdrant:v1.19.1

    security_opt:
      - no-new-privileges:true

    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT}:6333"

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

    volumes:
      - ${QDRANT_VOLUME}:/qdrant/storage

    restart: unless-stopped


  volume-permission-helper:
    image: alpine:3.22
    user: root

    volumes:
      - ${RUSTFS_VOLUME}:/data

    command:
      [
        "sh",
        "-c",
        "mkdir -p /data && chown -R 10001:10001 /data"
      ]

    restart: "no"


  rustfs:
    image: rustfs/rustfs:1.0.0

    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully

    security_opt:
      - no-new-privileges:true

    ports:
      - "${RUSTFS_API_PORT}:9000"
      - "${RUSTFS_CONSOLE_PORT}:9001"

    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: info

    volumes:
      - ${RUSTFS_VOLUME}:/data

    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

