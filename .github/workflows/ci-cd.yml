name: CI and AWS deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Audit Git history for secrets
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo:ro" -w /repo zricethezav/gitleaks:v8.24.3 detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --log-opts=--all
      - name: Install validation dependencies
        run: python scripts/dependencies.py install ci
      - name: Tests and syntax
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -m compileall -q src scripts infra
          python -m pytest -q
          git diff --check
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.4
      - name: Terraform validation (no credentials)
        run: |
          terraform -chdir=infra/aws fmt -check
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
      - name: Compose validation
        run: python scripts/validate_compose.py
      - name: Build runtime
        run: |
          docker build --target runtime -t acartomante:ci .
          docker run --rm --network none -e AWS_EC2_METADATA_DISABLED=true --entrypoint python acartomante:ci -c 'import src.api.main; import src.generation.provider; import src.retrieval.enrichment'
  infrastructure:
    if: github.ref == 'refs/heads/main' && vars.AWS_INFRA_ROLE_ARN != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/infrastructure.yml
    with:
      operation: apply
    secrets:
      TF_PRODUCTION_TFVARS_JSON: ${{ secrets.TF_PRODUCTION_TFVARS_JSON }}
  deploy:
    if: always() && needs.validate.result == 'success' && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') && github.ref == 'refs/heads/main' && vars.AWS_APP_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: aws-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      OPS_BUCKET: ${{ vars.OPS_BUCKET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - name: Read current deployment context
        run: aws s3 cp "s3://$OPS_BUCKET/config/deployment.json" "$RUNNER_TEMP/deployment.local.json" --only-show-errors
      - name: Install AWS operation client
        run: python3 scripts/dependencies.py install ops
      - name: Check emergency stop
        run: python3 scripts/cloud.py check-emergency --bucket "$OPS_BUCKET"
      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          : "${ECR_REPOSITORY:?Configure as variáveis pelo script configure_github.py}"
          registry="${ECR_REPOSITORY%%/*}"
          repository="${ECR_REPOSITORY#*/}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          if ! digest=$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="git-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
            docker build --target runtime -t "$ECR_REPOSITORY:git-$GITHUB_SHA" .
            docker push "$ECR_REPOSITORY:git-$GITHUB_SHA"
            digest=$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="git-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          fi
          echo "image=$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
      - name: Package application release
        run: |
          python3 scripts/package_release.py --sha "$GITHUB_SHA" --only app
      - name: Publish application release
        run: |
          aws s3 cp dist/bundle.tar.gz "s3://$OPS_BUCKET/releases/$GITHUB_SHA/bundle.tar.gz" --only-show-errors
      - name: Deploy through restricted SSM document
        env:
          API_IMAGE: ${{ steps.image.outputs.image }}
        run: python3 scripts/cloud.py --outputs "$RUNNER_TEMP/deployment.local.json" deploy --release "$GITHUB_SHA" --image "$API_IMAGE"
