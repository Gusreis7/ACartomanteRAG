name: AWS ETL
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Smoke verifica; run-from-raw processa o Raw coletado no notebook
        type: choice
        options: [smoke, run-from-raw, run]
        default: smoke
      run_id:
        description: Identificador estável do processamento, por exemplo corpus-v1
        required: true
        type: string
        default: smoke-v1
      revision:
        description: SHA completo já na main; vazio usa a revisão desta execução
        required: false
        type: string
      promote:
        description: Após validar, selecionar os dados para produção e recarregar a API existente
        type: boolean
        default: false
      raw_id:
        description: Para run-from-raw, snapshot concluído no S3 pelo crawler local (ex. machado-v1)
        required: false
        type: string
      resume_from_revision:
        description: SHA anterior do checkpoint para adotar nova revisão; vazio nas retomadas da mesma revisão
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: aws-production
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  OPS_BUCKET: ${{ vars.OPS_BUCKET }}
jobs:
  etl:
    if: github.ref == 'refs/heads/main' && vars.AWS_ETL_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      glue_run_id: ${{ steps.start.outputs.glue_run_id }}
    permissions:
      contents: read
      id-token: write
    env:
      REQUESTED_REVISION: ${{ inputs.revision }}
      RUN_ID: ${{ inputs.run_id }}
      OPERATION: ${{ inputs.operation }}
      PROMOTE: ${{ inputs.promote }}
      RAW_ID: ${{ inputs.raw_id }}
      RESUME_FROM_REVISION: ${{ inputs.resume_from_revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and select revision
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in smoke|run|run-from-raw) ;; *) exit 1 ;; esac
          [[ "$RUN_ID" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo 'run_id inválido'; exit 1; }
          [[ "$OPERATION" != smoke || "$PROMOTE" != true ]] || { echo 'Smoke não promove dados'; exit 1; }
          revision="${REQUESTED_REVISION:-$GITHUB_SHA}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Use um SHA completo'; exit 1; }
          git merge-base --is-ancestor "$revision" "$GITHUB_SHA"
          if [ -n "$RESUME_FROM_REVISION" ]; then
            [[ "$OPERATION" = run-from-raw && "$RESUME_FROM_REVISION" =~ ^[0-9a-f]{40}$ && "$RESUME_FROM_REVISION" != "$revision" ]] || { echo 'Migração exige run-from-raw e SHA anterior completo'; exit 1; }
            git merge-base --is-ancestor "$RESUME_FROM_REVISION" "$revision"
            git show "$revision:infra/glue/job.py" | grep -F -- 'p.add_argument("--resume-from-revision"' >/dev/null || { echo 'Use uma revisão com suporte ao Mantle'; exit 1; }
          fi
          if [ "$OPERATION" = run-from-raw ]; then
            [[ "$RAW_ID" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo 'Preencha raw_id'; exit 1; }
            git show "$revision:infra/glue/job.py" | grep -F -- 'p.add_argument("--raw-id"' >/dev/null || { echo 'A revisão escolhida não suporta Raw local; use o SHA deste patch'; exit 1; }
          elif [ -n "$RAW_ID" ]; then
            echo 'raw_id é exclusivo de run-from-raw'; exit 1
          fi
          echo "ETL_REVISION=$revision" >> "$GITHUB_ENV"
          echo "Revisão ETL: $revision; run_id: $RUN_ID; operação: $OPERATION; promoção: $PROMOTE"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install controller dependencies
        run: python -m pip install -c requirements-runtime.lock boto3
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ETL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: etl-${{ github.run_id }}
          role-duration-seconds: 10800
      - name: Read current deployment context
        run: aws s3 cp "s3://$OPS_BUCKET/config/deployment.json" "$RUNNER_TEMP/deployment.local.json" --only-show-errors
      - name: Prepare immutable Glue bundle if missing
        shell: bash
        run: |
          set -euo pipefail
          result=0
          python scripts/cloud.py --outputs "$RUNNER_TEMP/deployment.local.json" check-glue --revision "$ETL_REVISION" || result=$?
          if [ "$result" -eq 3 ]; then
            mkdir -p "$RUNNER_TEMP/etl-source" "$RUNNER_TEMP/etl-bundle/glue"
            git archive "$ETL_REVISION" | tar -x -C "$RUNNER_TEMP/etl-source"
            docker build -f "$RUNNER_TEMP/etl-source/infra/glue/Dockerfile.wheels" \
              --output "type=local,dest=$RUNNER_TEMP/etl-bundle/glue" "$RUNNER_TEMP/etl-source"
            python scripts/package_release.py --source-root "$RUNNER_TEMP/etl-source" \
              --sha "$ETL_REVISION" --only glue --output "$RUNNER_TEMP/etl-bundle"
            python scripts/cloud.py --outputs "$RUNNER_TEMP/deployment.local.json" upload-glue \
              --revision "$ETL_REVISION" --directory "$RUNNER_TEMP/etl-bundle/glue"
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          fi
      - name: Start one Glue execution
        id: start
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [ "$OPERATION" = run-from-raw ]; then
            options+=(--raw-id "$RAW_ID" --steps bronze,silver,text-index,enrichment,enrichment-index)
          fi
          [ "$OPERATION" != smoke ] || options+=(--smoke)
          [ "$PROMOTE" != true ] || options+=(--promote)
          [ -z "$RESUME_FROM_REVISION" ] || options+=(--resume-from-revision "$RESUME_FROM_REVISION")
          python -u scripts/cloud.py --outputs "$RUNNER_TEMP/deployment.local.json" glue \
            --revision "$ETL_REVISION" --run-id "$RUN_ID" \
            --run-id-file "$RUNNER_TEMP/glue-run-id" --expected-timeout-minutes 600 "${options[@]}"
          IFS= read -r glue_run_id < "$RUNNER_TEMP/glue-run-id"
          printf 'glue_run_id=%s\n' "$glue_run_id" >> "$GITHUB_OUTPUT"

  monitor:
    name: Acompanhar Glue (${{ matrix.window }}/5)
    needs: etl
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        window: [1, 2, 3, 4, 5]
    permissions:
      contents: read
      id-token: write
    env:
      GLUE_RUN_ID: ${{ needs.etl.outputs.glue_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install controller dependencies
        run: python -m pip install -c requirements-runtime.lock boto3
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ETL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: etl-monitor-${{ github.run_id }}-${{ matrix.window }}
          role-duration-seconds: 10800
      - name: Read current deployment context
        run: aws s3 cp "s3://$OPS_BUCKET/config/deployment.json" "$RUNNER_TEMP/deployment.local.json" --only-show-errors
      - name: Follow the same Glue execution for up to 135 minutes
        shell: bash
        run: |
          set -euo pipefail
          result=0
          python -u scripts/cloud.py --outputs "$RUNNER_TEMP/deployment.local.json" wait-glue \
            --job-run-id "$GLUE_RUN_ID" --wait-seconds 8100 || result=$?
          if [ "$result" -ne 0 ] && [ "$result" -ne 3 ]; then
            exit "$result"
          fi

  finish:
    name: Confirmar resultado do ETL
    needs: [etl, monitor]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      GLUE_RUN_ID: ${{ needs.etl.outputs.glue_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install controller dependencies
        run: python -m pip install -c requirements-runtime.lock boto3
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ETL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: etl-finish-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Read current deployment context
        run: aws s3 cp "s3://$OPS_BUCKET/config/deployment.json" "$RUNNER_TEMP/deployment.local.json" --only-show-errors
      - name: Require Glue success before finishing
        run: python -u scripts/cloud.py --outputs "$RUNNER_TEMP/deployment.local.json" wait-glue --job-run-id "$GLUE_RUN_ID" --wait-seconds 60
      - name: Reload application after data promotion
        if: inputs.operation != 'smoke' && inputs.promote
        run: python -u scripts/cloud.py --outputs "$RUNNER_TEMP/deployment.local.json" reload-data
