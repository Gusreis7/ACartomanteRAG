name: AWS infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan consulta; apply executa o plano gerado nesta execução
        type: choice
        options: [plan, apply]
        default: plan
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
    secrets:
      TF_PRODUCTION_TFVARS_JSON:
        required: true
permissions:
  contents: read
jobs:
  terraform:
    if: github.ref == 'refs/heads/main' && vars.AWS_INFRA_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: aws-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_KEY: ${{ vars.TF_STATE_KEY }}
      OPS_BUCKET: ${{ vars.OPS_BUCKET }}
      OPERATION: ${{ inputs.operation }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate operation and configuration
        env:
          PRODUCTION_TFVARS_JSON: ${{ secrets.TF_PRODUCTION_TFVARS_JSON }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          case "$OPERATION" in plan|apply) ;; *) exit 1 ;; esac
          : "${STATE_BUCKET:?Execute o bootstrap inicial}"
          : "${STATE_KEY:?Execute o bootstrap inicial}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          payload = os.environ.get("PRODUCTION_TFVARS_JSON", "")
          if not payload.strip():
              raise SystemExit("Erro: cadastre o Secret TF_PRODUCTION_TFVARS_JSON com o JSON usado no bootstrap.")
          try:
              config = json.loads(payload)
          except json.JSONDecodeError:
              raise SystemExit("Erro: TF_PRODUCTION_TFVARS_JSON não contém JSON válido; conteúdo omitido.") from None
          declared = set(re.findall(r'variable\s+"([^"\n]+)"', Path("infra/aws/variables.tf").read_text()))
          if not isinstance(config, dict) or set(config) - declared:
              raise SystemExit("Erro: tfvars deve ser um objeto com apenas as variáveis Terraform declaradas.")
          if str(config.get("github_repository_id", "")) != os.environ["EXPECTED_REPOSITORY_ID"]:
              raise SystemExit("Erro: o ID do repositório nos tfvars não corresponde a esta execução.")
          if config.get("region", "us-east-1") != os.environ["AWS_REGION"]:
              raise SystemExit("Erro: a região dos tfvars diverge da variável AWS_REGION.")
          if not re.fullmatch(r"ami-[0-9a-f]+", str(config.get("ami_id", ""))):
              raise SystemExit("Erro: use a AMI fixada no arquivo gerado pelo bootstrap.")
          for value in config.values():
              if isinstance(value, str) and value:
                  masked = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{masked}", flush=True)
          descriptor = os.open("infra/aws/production.tfvars.json", os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as output:
              os.fchmod(output.fileno(), 0o600)
              output.write(payload)
          print("Configuração privada preparada; conteúdo omitido.")
          PY
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: infra-${{ github.run_id }}
      - name: Initialize and validate
        run: |
          terraform -chdir=infra/aws init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config=encrypt=true -backend-config=use_lockfile=true
          terraform -chdir=infra/aws fmt -check
          terraform -chdir=infra/aws validate
      - name: Install AWS operation client
        run: python3 scripts/dependencies.py install ops
      - name: Check emergency stop
        if: inputs.operation == 'apply'
        run: python3 scripts/cloud.py check-emergency --bucket "$OPS_BUCKET"
      - name: Plan
        run: terraform -chdir=infra/aws plan -input=false -lock-timeout=5m -var-file=production.tfvars.json -out="$RUNNER_TEMP/deployment.tfplan"
      - name: Apply
        if: inputs.operation == 'apply'
        run: |
          python3 scripts/cloud.py check-emergency --bucket "$OPS_BUCKET"
          terraform -chdir=infra/aws apply -input=false "$RUNNER_TEMP/deployment.tfplan"
      - name: Remove private Terraform inputs and plan
        if: always()
        run: rm -f -- infra/aws/production.tfvars.json "$RUNNER_TEMP/deployment.tfplan"
