# Overlay local do Raspberry: usar junto de docker-compose.yml.
services:
  ollama:
    image: ollama/ollama:0.40.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ollama_private
      - ollama_egress
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  ollama-model:
    image: ollama/ollama:0.40.4
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    entrypoint: ["/bin/sh", "/bootstrap/prepare_ollama.sh"]
    volumes:
      - ./scripts/prepare_ollama.sh:/bootstrap/prepare_ollama.sh:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    networks:
      - ollama_private
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  api:
    environment: &raspberry-environment
      CONFIG_FILE: /app/config/config.raspberry.yaml
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ollama
      LLM_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      ENRICHMENT_PROVIDER: ollama
      ENRICHMENT_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    volumes:
      - ./config/config.raspberry.yaml:/app/config/config.raspberry.yaml:ro
    networks:
      - ollama_private
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      start_period: 15m

  tools:
    environment: *raspberry-environment
    volumes:
      - ./config/config.raspberry.yaml:/app/config/config.raspberry.yaml:ro
    networks:
      - ollama_private
    depends_on:
      ollama-model:
        condition: service_completed_successfully

networks:
  ollama_private:
    internal: true
  ollama_egress:
    driver: bridge

volumes:
  ollama_models:
