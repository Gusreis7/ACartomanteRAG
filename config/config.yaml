storage:
  raw_bucket: acartomante-raw
  bronze_bucket: acartomante-bronze
  silver_bucket: acartomante-silver
  embedding_indexes_bucket: acartomante-indexes
  benchmarks_bucket: acartomante-benchmarks
  enrichment_bucket: acartomante-enrichment
  
bronze:
  coletanea:
    similaridade_threshold: 0.1
    qtd_titulos_minima: 2
    tamanho_fragmento: 1000
    tamanho_minimo_fragmento: 100
  carta:
    min_assinaturas: 5
  poema:
    max_palavras_linha: 10
    min_pct_linhas_curtas: 0.85
  teatro:
    min_repeticoes_locutor: 3
    min_locutores: 2
    min_turnos: 10
    min_pct_locutores: 0.91
silver:
  pipeline_version: 1
  chunking:
    strategy: fixed
    tokenizer: roberta_crawl_pt
    chunk_size: 256
    overlap: 32
  tokenizers:
    roberta_crawl_pt:
      model: eduagarcia/RoBERTaCrawlPT-base
      revision: main
    bertimbau:
      model: neuralmind/bert-base-portuguese-cased
      revision: main
  semantic:
    min_capitulos: 2
    min_mediana_chars: 200
embedding:
  pipeline_version: 1
  selected_model: colibri
  models:
    colibri:
      backend: sentence_transformers
      model: tardellirs/colibri-embed-ptbr
      revision: main
      inference_dtype: float32
      pooling: model
      document_prompt_name: document
      query_prompt_name: query
      truncate_dim: null
    qwen3_embedding_06b:
      backend: sentence_transformers
      model: Qwen/Qwen3-Embedding-0.6B
      revision: main
      inference_dtype: float32
      pooling: model
      document_prompt_name: document
      query_prompt_name: query
      truncate_dim: null
  index:
    normalize_embeddings: false
    distance: cosine
  execution:
    device: cpu
    batch_size: 32
retrieval_strategy: dense_cross_encoder
retrieval_index:
  release: default
  index_id: idx_colibri-embed-ptbr_2b279b323307
retrievals:
  bm25:
    top_k: 10
  dense:
    top_k: 10
  dense_cross_encoder:
    candidate_k: 25
    top_k: 10
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    revision: main
    device: cpu
retrieval_benchmark:
  evidence_min_coverage: 0.6
  warmup_runs: 3
  
generation:
  provider: ollama
  model: qwen3.5:4b
  reasoning: false
  base_url: http://localhost:11434
  temperature: 0.1
  top_p: 0.9
  max_tokens: 1024
  num_ctx: 10240
  timeout_seconds: 120
  keep_alive: 10m
  max_context_chars: 20000
  max_parallel: 2
  acquire_timeout_seconds: 15
api:
  host: 0.0.0.0
  port: 8000
chat:
  history_turns: 3
enrichment:
  pipeline_version: 1
  model: qwen3.5:4b
  prompt_version: summary_events_v1
  schema_version: summary_events_v1
  strategy: hybrid
  unit_chars: 18000
  char_overlap: 800
  final_context_chars: 24000
  temperature: 0.0
  top_p: 0.9
  max_tokens: 1024
  num_ctx: 8192
  num_batch: 256
  max_parallel: 2
  timeout_seconds: 300
  keep_alive: 10m
  reasoning: false
  semantic:
    min_capitulos: 2
    min_mediana_chars: 200
enrichment_retrieval:
  enabled: true
  top_k: 3
  max_context_chars: 6000
  max_context_fraction: 0.25
  fallback_embedder: qwen3_embedding_06b
  expose_as_evidence: false
  fail_open: true
