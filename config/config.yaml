storage:
  raw_bucket: acartomante-raw
  bronze_bucket: acartomante-bronze
  silver_bucket: acartomante-silver
  embedding_indexes_bucket: acartomante-indexes
  benchmarks_bucket: acartomante-benchmarks

bronze:
  coletanea:
    similaridade_threshold: 0.10
    qtd_titulos_minima: 2
    tamanho_fragmento: 1000
    tamanho_minimo_fragmento: 100

  carta:
    min_assinaturas: 5

  poema:
    max_palavras_linha: 10
    min_pct_linhas_curtas: 0.85

  teatro:
    min_repeticoes_locutor: 3
    min_locutores: 2
    min_turnos: 10
    min_pct_locutores: 0.91

silver:
  pipeline_version: 1

  chunking:
    strategy: hybrid
    tokenizer: bertimbau
    chunk_size: 256
    overlap: 32

  tokenizers:
    roberta_crawl_pt:
      model: eduagarcia/RoBERTaCrawlPT-base
      revision: main

    bertimbau:
      model: neuralmind/bert-base-portuguese-cased
      revision: main

  semantic:
    min_capitulos: 2
    min_mediana_chars: 200

embedding:
  pipeline_version: 1
  selected_model: qwen3_embedding_06b

  models:
    colibri:
      backend: sentence_transformers
      model: tardellirs/colibri-embed-ptbr
      revision: main
      inference_dtype: float32
      pooling: model
      document_prompt_name: document
      query_prompt_name: query
      truncate_dim: null

    qwen3_embedding_06b:
      backend: sentence_transformers
      model: Qwen/Qwen3-Embedding-0.6B
      revision: main
      inference_dtype: bfloat16
      pooling: model
      document_prompt_name: document
      query_prompt_name: query
      truncate_dim: null

  index:
    normalize_embeddings: false
    distance: cosine

  execution:
    device: auto
    batch_size: 32

retrieval:
  # null: usa release promovida pelo CI/ambiente.
  # preenchido: pin explícito/rollback.
  release: default
  index_id: null

