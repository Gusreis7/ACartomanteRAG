name: Integration CI

env:
  COMPOSE_FILE: "docker-compose.yml:docker-compose.raspberry.yml"

on:
  push:
    branches:
      - develop

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: acartomante-ci-${{ gitea.run_number }}

      # Interface publicada no host; CI usa somente loopback.
      API_BIND_IP: 127.0.0.1

      # Application connection
      RUSTFS_ENDPOINT: http://localhost:9003
      QDRANT_URL: http://localhost:6335

      # Secrets
      RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
      RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

      # Docker Compose / CI deployment
      RUSTFS_VOLUME: /tmp/acartomante-ci-${{ gitea.run_number }}/rustfs
      QDRANT_VOLUME: /tmp/acartomante-ci-${{ gitea.run_number }}/qdrant
      REDIS_VOLUME: /tmp/acartomante-ci-${{ gitea.run_number }}/redis
      RUSTFS_API_PORT: 9003
      RUSTFS_CONSOLE_PORT: 9004
      QDRANT_HTTP_PORT: 6335
      REDIS_PORT: 6380


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI storage
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          mkdir -p "$RUSTFS_VOLUME" "$QDRANT_VOLUME" "$REDIS_VOLUME"

      - name: Check repository (Raspberry maintenance)
        run: bash scripts/check_raspberry_ci.sh

      - name: Pull images
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: bash scripts/compose_raspberry.sh pull

      - name: Check local infrastructure and runtime imports
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: bash scripts/check_raspberry_ci.sh

      - name: Show services
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: bash scripts/compose_raspberry.sh ps

      - name: Show logs on failure
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: bash scripts/compose_raspberry.sh logs --no-color

      - name: Shutdown services
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: bash scripts/compose_raspberry.sh down --volumes --remove-orphans

      - name: Cleanup CI storage
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          rm -rf "/tmp/acartomante-ci-${{ gitea.run_number }}"
