name: Integration CI

on:
  push:
    branches:
      - develop

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: acartomante-ci-${{ gitea.run_number }}

      RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
      RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}

      # Storage descartável exclusivo desta execução.
      RUSTFS_VOLUME: /tmp/acartomante-ci-${{ gitea.run_number }}/rustfs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI storage
        run: |
          mkdir -p "$RUSTFS_VOLUME"

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Pull images
        run: docker compose pull

      - name: Start services
        run: |
          docker compose up \
            --detach \
            --wait \
            --wait-timeout 120

      - name: Show services
        run: docker compose ps

      - name: RustFS health check
        run: |
          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:9000/health

          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:9001/rustfs/console/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown services
        if: always()
        run: |
          docker compose down \
            --remove-orphans

      - name: Cleanup CI storage
        if: always()
        run: |
          docker run --rm \
            -v "$RUSTFS_VOLUME:/data" \
            alpine:3.22 \
            sh -c "rm -rf /data/*"

          rm -rf "$(dirname "$RUSTFS_VOLUME")"