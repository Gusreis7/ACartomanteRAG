name: Deploy Production

env:
  COMPOSE_FILE: "docker-compose.yml:docker-compose.raspberry.yml"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: acartomante-prod

      # Interface publicada no host; CI usa somente loopback.
      API_BIND_IP: ${{ vars.API_BIND_IP }}

      # Application connection
      RUSTFS_ENDPOINT: http://localhost:9000
      QDRANT_URL: http://localhost:6333

      # Secrets
      RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
      RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

      # Docker Compose / production deployment
      RUSTFS_VOLUME: /home/gustavo/Volumes/rustfs
      QDRANT_VOLUME: /home/gustavo/Volumes/qdrant
      REDIS_VOLUME: /home/gustavo/Volumes/redis
      
      RUSTFS_API_PORT: 9000
      RUSTFS_CONSOLE_PORT: 9001
      QDRANT_HTTP_PORT: 6333
      REDIS_PORT: 6379

      # Deve apontar para o índice produzido pela execução
      # que este deploy pretende promover.
      INDEX_ID: ${{ vars.ACARTOMANTE_INDEX_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show deployment info
        run: |
          echo "Revisão (deploy local suspenso):"
          git rev-parse HEAD

          echo "Branch:"
          echo "${{ gitea.ref }}"

      - name: Validate production bind address
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        shell: bash
        run: |
          case "$API_BIND_IP" in
            ""|0.0.0.0|::)
              echo "Configure vars.API_BIND_IP com o IP específico da LAN do host de deploy."
              exit 1
              ;;
          esac

      - name: Prepare production storage
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          mkdir -p \
            "$RUSTFS_VOLUME" \
            "$QDRANT_VOLUME" \
            "$REDIS_VOLUME"

      - name: Check repository (Raspberry maintenance)
        run: bash scripts/check_raspberry_ci.sh

      - name: Pull images
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          bash scripts/compose_raspberry.sh pull

      - name: Build services
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          bash scripts/compose_raspberry.sh build

      - name: Deploy production
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          bash scripts/compose_raspberry.sh up \
            --detach \
            --wait \
            --wait-timeout 3600 \
            --remove-orphans

      - name: Prepare release tooling
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          python3 -m venv .venv-release

          .venv-release/bin/python scripts/dependencies.py install ops

      - name: Promote production release
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        env:
          BRANCH_NAME: main
        run: |
          source .venv-release/bin/activate

          chmod +x .gitea/scripts/promote_release.sh

          .gitea/scripts/promote_release.sh

      - name: Show production services
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          bash scripts/compose_raspberry.sh ps

      - name: Show logs on failure
        if: ${{ false }} # Pausado: docs/IMPEDITIVOS.md
        run: |
          bash scripts/compose_raspberry.sh logs --no-color