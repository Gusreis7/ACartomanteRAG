name: Main PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

jobs:
  main-pr:
    name: main-pr
    runs-on: ubuntu-latest

    env:
      
      COMPOSE_PROJECT_NAME: acartomante-ci-${{ gitea.run_number }}
      RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
      RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}

      RUSTFS_VOLUME: /tmp/acartomante-ci-${{ gitea.run_number }}/rustfs

      RUSTFS_API_PORT: 9003
      RUSTFS_CONSOLE_PORT: 9004

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source branch
        run: |
          echo "Source branch: ${GITHUB_HEAD_REF}"

          if [ "${GITHUB_HEAD_REF}" != "develop" ]; then
            echo "PRs para main devem vir da branch develop."
            exit 1
          fi

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build services
        run: docker compose build

      - name: Start services
        run: |
          docker compose up \
            --detach \
            --wait \
            --wait-timeout 120

      - name: Show services
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown services
        if: always()
        run: |
          docker compose down \
            --remove-orphans