name: Integration CI

on:
  push:
    branches:
      - develop

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: acartomante-ci-${{ gitea.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build services
        run: docker compose build

      - name: Start services
        run: |
          docker compose up \
            --detach \
            --wait \
            --wait-timeout 120

      - name: Show services
        run: docker compose ps

      - name: Health check
        run: |
          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8000/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown services
        if: always()
        run: |
          docker compose down \
            --remove-orphans